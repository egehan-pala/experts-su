[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-service"
version = "0.1.0"
description = "ETL pipeline for Experts@SU data collection from OpenAlex"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "httpx==0.25.0",
    "tenacity==8.2.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "typer==0.9.0",
    "python-dotenv==1.0.0",
    "python-json-logger==2.0.7",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.2",
    "ruff==0.0.280",
    "black==23.9.1",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]
ignore = []
exclude = ["build", "dist", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"