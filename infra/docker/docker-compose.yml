version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: experts-su-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: experts_su
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api-gateway:
    build:
      context: ../../services/api-gateway
    container_name: experts-su-api-gateway
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: experts_su
      DB_USER: postgres
      DB_PASSWORD: password
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  db_data:
