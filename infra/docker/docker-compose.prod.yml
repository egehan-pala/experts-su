version: '3.8'

services:
  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    container_name: experts-su-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-experts_su}
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-1
        awslogs-group: /experts-su/api-gateway
        awslogs-create-group: "true"

  web-frontend:
    build:
      context: ../../services/web-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: experts-su-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - api-gateway
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-1
        awslogs-group: /experts-su/web-frontend
        awslogs-create-group: "true"
